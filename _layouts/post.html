<!DOCTYPE html>
<html lang="en">

<head>  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <style>
    body {
      background-color: #1C1B22;
      color: #e0e0e0;
      font-family: monospace;
      margin: 60px auto;
      max-width: 960px;
      font-weight: 400;
      line-height: 25.5px;
      font-size: 17px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }

    a {
      color: #8ab4f8;
      text-decoration: none;
    }    nav {
      margin-bottom: 20px;
      align-self: flex-start;
      position: sticky;
      top: 0;
      background-color: #1C1B22;
      z-index: 100;
      padding: 10px 0;
      width: 100%;
    }

    .date {
      color: #aaa;
      margin-bottom: 30px;
      align-self: flex-start;
    }

    .content-wrapper {
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: flex-start;
      width: 100%;
    }

    article {
      max-width: 750px;
      position: relative;
    }

    article em {
      color: #c792ea;
      font-style: italic;
    }    ol {
      padding-left: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 1em 0;
    }

    .footnote-marker {
      color: #8ab4f8;
      vertical-align: super;
      font-size: smaller;
      cursor: pointer;
    }

    .footnote {
      position: absolute;
      left: 790px;
      /* Position after article + some margin */
      width: 220px;
      font-size: 0.9em;
      color: #aaa;
      margin-top: 0;
    }

    .footnote-inline {
      display: none;
      background-color: #2d2d39;
      border: 1px solid #3a3a4a;
      border-radius: 4px;
      padding: 8px;
      margin: 8px 0;
      font-size: 0.9em;
      color: #aaa;
    }

    /* Mobile styles */
    @media (max-width: 1024px) {
      .footnote {
        display: none;
      }
      
      .footnote-inline {
        display: block;
      }
    }    @media (max-width: 768px) {
      body {
        margin: 20px auto;
        padding: 60px 15px 0 15px; /* Add top padding to account for fixed nav */
        font-size: 16px;
        line-height: 24px;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        margin-bottom: 0;
        padding: 15px;
        background-color: #1C1B22;
        border-bottom: 1px solid #444;
        z-index: 1000;
        font-size: 14px;
        word-break: break-word;
        width: 100%;
        box-sizing: border-box;
      }

      article {
        max-width: 100%;
      }

      .content-wrapper {
        width: 100%;
      }

      pre {
        padding: 12px;
        font-size: 14px;
        overflow-x: auto;
      }

      code {
        font-size: 0.85em;
      }
    }    @media (max-width: 480px) {
      body {
        margin: 10px auto;
        padding: 76px 10px 0 10px; /* Add top padding for fixed nav */
        font-size: 15px;
        line-height: 22px;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        margin-bottom: 0;
        padding: 15px;
        background-color: #1C1B22;
        border-bottom: 1px solid #444;
        z-index: 1000;
        font-size: 14px;
        word-break: break-word;
        width: 100%;
        box-sizing: border-box;
      }

      .date {
        margin-bottom: 20px;
      }

      pre {
        padding: 10px;
        font-size: 13px;
        margin: 1em 0;
      }
    }

    a {
      color: rgb(158, 158, 255);
    }
    /* Inline code styling */
    code {
      background-color: #2d2d39;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9em;
      color: #f8f8f2;
    }
    /* Code block styling */
    pre {
      background-color: #2d2d39;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #3a3a4a;
      margin: 1.5em 0;
    }
    pre code {
      background-color: transparent;
      padding: 0;
      border-radius: 0;
      border: none;
      font-size: 0.95em;
      display: block;
      line-height: 1.5;
    }
    /* Optional: Add syntax highlighting colors */
    .highlight .keyword {
      color: #ff79c6;
    }

    .highlight .string {
      color: #f1fa8c;
    }

    .highlight .number {
      color: #bd93f9;
    }

    .highlight .comment {
      color: #6272a4;
    }
    p {
      text-align: justify;
    }
    
    /* MathJax responsive styles */
    mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
    }
    
    @media (max-width: 768px) {
      mjx-container {
        font-size: 0.9em;
        max-width: 100%;
        overflow-x: auto;
        display: block;
      }
      
      mjx-container[display="true"] {
        margin: 1em 0;
        padding: 0.5em;
        background-color: #2d2d39;
        border-radius: 4px;
        border: 1px solid #3a3a4a;
      }
    }
    
    @media (max-width: 480px) {
      mjx-container {
        font-size: 0.8em;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="{{ site.baseurl }}/">/ home</a> / <span>{{ page.title }}</span>
  </nav>

  <div class="date">{{ page.date | date: "%Y-%m-%d" }}</div>

  <div class="content-wrapper">
    <article>
      {{ content | replace: '<sup id="fnref:', '<span class=" footnote-marker" id="fnref:' | replace: '</sup>', '</span>' }}
    </article>
  </div>
  {% if page.math %}
  <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script async src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}  <script>
    function positionFootnotes() {
      // Check if we're on mobile
      const isMobile = window.innerWidth <= 1024;
      
      // Clear existing positioned footnotes
      document.querySelectorAll('.footnote').forEach(fn => fn.remove());
      document.querySelectorAll('.footnote-inline').forEach(fn => fn.remove());
      
      // Get all footnote references
      const footnoteRefs = document.querySelectorAll('.footnote-marker');
      
      footnoteRefs.forEach(function(ref, index) {
        const id = ref.id;
        const footnoteId = id.replace('fnref:', 'fn:');
        const footnote = document.getElementById(footnoteId);
        
        if (footnote) {
          if (isMobile) {
            // On mobile, show footnote inline
            const inlineNote = document.createElement('div');
            inlineNote.className = 'footnote-inline';
            inlineNote.innerHTML = footnote.innerHTML;
            
            // Insert after the paragraph containing the reference
            const paragraph = ref.closest('p') || ref.parentNode;
            paragraph.insertAdjacentElement('afterend', inlineNote);
            
            // Add click handler to toggle visibility
            ref.addEventListener('click', function(e) {
              e.preventDefault();
              inlineNote.style.display = inlineNote.style.display === 'none' ? 'block' : 'none';
            });
          } else {
            // On desktop, create a margin note that positions itself naturally
            const marginNote = document.createElement('div');
            marginNote.className = 'footnote';
            marginNote.innerHTML = footnote.innerHTML;
            marginNote.setAttribute('data-ref-id', id);
            
            // Instead of calculating position, let CSS handle it
            ref.setAttribute('data-footnote-index', index);
            marginNote.setAttribute('data-footnote-index', index);
            
            // Add the footnote to the article
            const article = document.querySelector('article');
            article.appendChild(marginNote);
          }
          
          // Hide the original footnote
          footnote.style.display = 'none';
        }
      });
      
      // Use CSS to position footnotes based on their corresponding reference
      if (!isMobile) {
        const style = document.createElement('style');
        style.textContent = `
          .footnote-marker[data-footnote-index]::after {
            content: "";
            position: absolute;
            left: 790px;
            width: 1px;
            height: 1px;
            pointer-events: none;
          }
          
          .footnote[data-footnote-index] {
            position: absolute;
            left: 790px;
          }
        `;
        
        footnoteRefs.forEach(function(ref, index) {
          const marginNote = document.querySelector(`.footnote[data-footnote-index="${index}"]`);
          if (marginNote) {
            // Position footnote at the same line as its reference
            const computedStyle = window.getComputedStyle(ref);
            const refTop = ref.offsetTop;
            marginNote.style.top = refTop + 'px';
          }
        });
        
        document.head.appendChild(style);
      }
    }
      // Wait for all content including images to load
    function waitForAllContent() {
      // Wait for images
      const images = document.querySelectorAll('img');
      let loadedImages = 0;
      
      function checkIfAllLoaded() {
        if (loadedImages === images.length) {
          // Add a small delay to ensure layout is stable
          setTimeout(positionFootnotes, 250);
        }
      }
      
      if (images.length === 0) {
        positionFootnotes();
        return;
      }
      
      images.forEach(img => {
        if (img.complete) {
          loadedImages++;
        } else {
          img.addEventListener('load', () => {
            loadedImages++;
            checkIfAllLoaded();
          });
          img.addEventListener('error', () => {
            loadedImages++;
            checkIfAllLoaded();
          });
        }
      });
      
      checkIfAllLoaded();
    }
    
    // Use multiple events to ensure footnotes are positioned correctly
    document.addEventListener('DOMContentLoaded', waitForAllContent);
    window.addEventListener('load', () => setTimeout(positionFootnotes, 100));
    window.addEventListener('resize', () => setTimeout(positionFootnotes, 100));
  </script>
</body>
</html>
